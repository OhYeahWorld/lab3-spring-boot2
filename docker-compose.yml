services:
  postgres:
    image: postgres:17-alpine
    container_name: lab3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab3
      POSTGRES_USER: lab3
      POSTGRES_PASSWORD: lab3
    ports:
      - "5433:5432"
    volumes:
      - lab3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab3 -d lab3"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  lab3_pgdata:
