spring.application.name=accounting-lab3

# PostgreSQL. Можно переопределить переменными окружения.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/lab3}
spring.datasource.username=${DB_USER:lab3}
spring.datasource.password=${DB_PASSWORD:lab3}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=8

# Схема БД и демонстрационные данные поднимаются самим приложением один раз при старте.
# Это сохраняет в бизнес-схеме ровно три таблицы: saldo, charges, payments.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false

server.port=${PORT:8080}
app.time-zone=${APP_TIME_ZONE:Europe/Moscow}

app.database.init.enabled=${DB_INIT_ENABLED:true}
app.database.init.retries=${DB_INIT_RETRIES:15}
app.database.init.delay-ms=${DB_INIT_DELAY_MS:2000}
